<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="เรียนและเล่นโกะ (หมากล้อม / 囲碁 / Go) ในเบราว์เซอร์ — 12 บทเรียน เล่นกับบอท 4 ระดับ ไทย/English/日本語 · Learn and play Go in your browser, free, no install.">
  <title>囲碁 · Go · หมากล้อม — เรียนและเล่น</title>

  <!-- link preview (X, LINE, Discord, Facebook…) — absolute URLs required -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://go.soxylo.com/">
  <meta property="og:site_name" content="囲碁 · Go · หมากล้อม">
  <meta property="og:title" content="囲碁 · Go · หมากล้อม — learn &amp; play">
  <meta property="og:description" content="ブラウザで囲碁を学んで打てる無料アプリ。12レッスン、4段階のボット（有段KataGo対応）、日本語・ไทย・English。インストール不要。">
  <meta property="og:image" content="https://go.soxylo.com/assets/og.png?v=1.19.2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="碁石さん stones on a Go board — 囲碁 · Go · หมากล้อม, go.soxylo.com">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="th_TH">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="囲碁 · Go · หมากล้อม — learn &amp; play">
  <meta name="twitter:description" content="ブラウザで囲碁を学んで打てる無料アプリ。12レッスン、4段階のボット、日本語対応。インストール不要。">
  <meta name="twitter:image" content="https://go.soxylo.com/assets/og.png?v=1.19.2">
  <link rel="stylesheet" href="styles.css?v=1.19.2">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1><span class="cjk">囲碁</span> Go <span class="cjk">หมากล้อม</span></h1>
        <span class="sub">learn &amp; play</span>
      </div>
      <div class="top-controls">
        <button id="langBtn" class="btn" type="button">EN</button>
        <button id="themeBtn" class="btn icon-btn" type="button" aria-label="theme">◐</button>
      </div>
    </header>

    <div class="modes" role="group" aria-label="mode">
      <button id="modePlayBtn" data-mode="play" type="button" aria-pressed="false">Two players</button>
      <button id="modeBotBtn" data-mode="bot" type="button" aria-pressed="false">Vs bot</button>
      <button id="modeLearnBtn" data-mode="learn" type="button" aria-pressed="true">Learn</button>
    </div>

    <div class="layout">
      <section>
        <div class="board-wrap">
          <svg id="board" tabindex="0" role="application" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="gradBlack" cx="38%" cy="32%" r="75%">
                <stop offset="0%" stop-color="#6a6358"/>
                <stop offset="40%" stop-color="#2a2722"/>
                <stop offset="100%" stop-color="#100e0b"/>
              </radialGradient>
              <radialGradient id="gradWhite" cx="38%" cy="32%" r="80%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="55%" stop-color="#f1ece0"/>
                <stop offset="100%" stop-color="#d2c9b6"/>
              </radialGradient>
            </defs>
            <g id="layerGrid"></g>
            <g id="layerMark"></g>
            <g id="layerStone"></g>
            <g id="layerOver"></g>
          </svg>
        </div>

        <div class="actions">
          <button id="newGameBtn" class="btn primary" type="button">New game</button>
          <button id="passBtn" class="btn" type="button">Pass</button>
          <button id="undoBtn" class="btn" type="button">Undo</button>
          <button id="countBtn" class="btn" type="button">Count score</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <aside class="panel">
        <div class="mascot-row">
          <!-- 碁石さん art by とろろ (@tororo2048), used with permission — non-commercial, educational. data-state swaps the expression -->
          <div id="mascot" class="mascot" data-state="idle" aria-hidden="true"></div>
          <p id="mascotMsg" class="mascot-msg"></p>
        </div>
        <h2 id="panelTitle">Learn</h2>
        <p id="panelBody"></p>

        <div id="goalBox" class="goal-box" hidden><span id="goalText"></span></div>

        <div id="lessonNav" class="lesson-nav" hidden>
          <button id="prevLesson" type="button">‹ Prev</button>
          <span id="lessonProgress" class="progress">1 / 12</span>
          <button id="nextLesson" type="button">Next ›</button>
        </div>
        <div class="actions actions-tight">
          <button id="hintBtn" class="btn" type="button" hidden>Hint</button>
          <button id="gotItBtn" class="btn primary" type="button" hidden>Got it</button>
        </div>

        <div class="meta">
          <span class="turn"><span id="turnLabel">To move</span>:
            <span id="turnSwatch" class="swatch black"></span><span id="turnName">Black</span></span>
        </div>
        <div class="caps">
          <span id="capBlack">Black captured: 0</span>
          <span id="capWhite">White captured: 0</span>
        </div>

        <div id="colorRow" class="diff-row" hidden>
          <span id="colorLabel" class="diff-label">You play</span>
          <div class="modes diff-seg" role="group" aria-labelledby="colorLabel">
            <button id="colorBlack" data-color="1" type="button" aria-pressed="true">Black</button>
            <button id="colorWhite" data-color="2" type="button" aria-pressed="false">White</button>
          </div>
        </div>

        <div id="difficultyRow" class="diff-row" hidden>
          <span id="diffLabel" class="diff-label">Difficulty</span>
          <div class="modes diff-seg" role="group" aria-labelledby="diffLabel">
            <button id="diffEasy" data-diff="easy" type="button" aria-pressed="false">Easy</button>
            <button id="diffMed" data-diff="medium" type="button" aria-pressed="true">Medium</button>
            <button id="diffHard" data-diff="hard" type="button" aria-pressed="false">Hard</button>
            <button id="diffNeural" data-diff="neural" type="button" aria-pressed="false">Neural</button>
          </div>
          <p id="diffNote" class="diff-note" hidden></p>
        </div>

        <div id="sizeRow" class="size-row">
          <label id="sizeLabel" for="sizeSel">Board size</label>
          <select id="sizeSel">
            <option value="9" selected>9 × 9</option>
            <option value="13">13 × 13</option>
            <option value="19">19 × 19</option>
          </select>
        </div>

        <div id="stoneRow" class="diff-row">
          <span id="stoneLabel" class="diff-label">Stones</span>
          <div class="modes diff-seg" role="group" aria-labelledby="stoneLabel">
            <button id="stoneNormal" data-stone="normal" type="button" aria-pressed="true">Classic</button>
            <button id="stoneMascot" data-stone="mascot" type="button" aria-pressed="false">Mascot</button>
          </div>
        </div>

        <div id="scoreControls" hidden>
          <p id="scoreHint" class="score-hint"></p>
          <button id="resumeBtn" class="btn" type="button">Resume</button>
        </div>

        <div id="scoreBox" class="score-box" hidden>
          <h3 id="scoreHead">Score</h3>
          <div id="scoreLine" class="line"></div>
          <div id="scoreWinner" class="winner"></div>
        </div>
      </aside>
    </div>

    <footer>
      <span><span id="footMadeBy">Made by</span> <a href="https://github.com/XYLOHEAT" rel="noopener noreferrer" target="_blank">XYLO</a></span>
      <span> · <span id="footArt">Artwork</span> 碁石さん © <a href="https://tororoigo.web.fc2.com/" rel="noopener noreferrer" target="_blank">とろろ</a></span>
      <span> · <span id="footOpen">open source (MIT):</span>
        <a id="repoLink" href="#" rel="noopener noreferrer" target="_blank">source on GitHub</a></span>
      <span> · <button id="versionBtn" class="ver-btn" type="button"><span id="version"></span></button></span>
    </footer>
  </div>

  <dialog id="changelog" class="changelog">
    <div class="changelog-head">
      <h3 id="changelogTitle">Version history</h3>
      <button id="changelogClose" class="btn" type="button">Close</button>
    </div>
    <ul id="changelogBody"></ul>
  </dialog>

  <!-- ?v= cache-busts on each release; bump together with VERSION in ui.js / worker.js -->
  <script src="engine.js?v=1.19.2"></script>
  <script src="lessons.js?v=1.19.2"></script>
  <script src="ui.js?v=1.19.2"></script>
</body>
</html>
